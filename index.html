<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebDesk — Welcome</title>
  <meta name="description" content="WebDesk: a portfolio that looks and feels like a desktop.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="desktop" id="desktop">

    <!-- Desktop icons -->
    <ul class="icons" aria-label="Desktop">
      <li>
        <button class="icon" data-name="Projects" type="button">
          <span class="iconImg iconImgFolder" aria-hidden="true"></span>
          <span class="iconLabel">Projects</span>
        </button>
      </li>
      <li>
        <button class="icon" data-name="About me" type="button">
          <span class="iconImg iconImgFile" aria-hidden="true"></span>
          <span class="iconLabel">about-me.txt</span>
        </button>
      </li>
      <li>
        <button class="icon" data-name="Contact" type="button">
          <span class="iconImg iconImgMail" aria-hidden="true"></span>
          <span class="iconLabel">Contact</span>
        </button>
      </li>
      <li>
        <button class="icon" data-name="Trash" type="button">
          <span class="iconImg iconImgTrash" aria-hidden="true"></span>
          <span class="iconLabel">Trash</span>
        </button>
      </li>
    </ul>

    <!-- Welcome window -->
    <section class="window" id="welcome" aria-labelledby="welcomeTitle">
      <header class="windowBar" data-drag-handle>
        <div class="windowControls">
          <button class="dot dotClose" type="button" aria-label="Close window" data-action="close"></button>
          <button class="dot dotMin" type="button" aria-label="Minimize window" data-action="close"></button>
          <button class="dot dotMax" type="button" aria-label="Wiggle window" data-action="wiggle"></button>
        </div>
        <h1 class="windowTitle" id="welcomeTitle">welcome.txt</h1>
      </header>

      <div class="windowBody">
        <p class="hello">
          <span id="typed" aria-live="polite"></span><span class="caret" aria-hidden="true"></span>
        </p>

        <div class="intro" id="intro">
          <p>
            Welcome to <strong>WebDesk</strong> — my portfolio, disguised as a desktop.
            Every project lives in a folder. Click around, open things, poke at stuff.
            Nothing here will crash. <em>Probably.</em>
          </p>

          <ul class="facts">
            <li><span aria-hidden="true">📁</span> Projects are folders</li>
            <li><span aria-hidden="true">🖱️</span> Windows are draggable</li>
            <li><span aria-hidden="true">☕</span> Built with HTML, CSS &amp; JS</li>
          </ul>

          <div class="actions">
            <button class="btn btnPrimary" type="button" id="enter">Open my desktop →</button>
            <button class="btn" type="button" id="hi">Say hi 👋</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Toast -->
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>

  <!-- Taskbar -->
  <footer class="taskbar">
    <span class="taskbarLogo">🖥️ WebDesk</span>
    <button class="taskbarItem" type="button" id="taskWelcome" aria-pressed="true">welcome.txt</button>
    <time class="taskbarClock" id="clock"></time>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
